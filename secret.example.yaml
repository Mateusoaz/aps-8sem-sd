# MODELO do Secret: documentação, NÃO é aplicado (fica fora da pasta k8s/ de propósito).
# O Secret real é criado a partir do .env, que não vai para o Git:
#   kubectl create secret generic banco-credenciais -n aps --from-env-file=.env
# (o scripts/k8s-up.sh faz isso). Os manifestos leem do Secret apenas as duas chaves abaixo.
#
# Lembrete: Secret guarda os valores em Base64, que é codificação, não criptografia.
#   kubectl get secret banco-credenciais -n aps -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: banco-credenciais
  namespace: aps
type: Opaque
stringData:
  POSTGRES_USER: usuario-ficticio
  POSTGRES_PASSWORD: troque-esta-senha
