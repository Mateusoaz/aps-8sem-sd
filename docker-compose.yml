# Pilha completa para desenvolver sem cluster: PostgreSQL + 3 APIs .NET 8 (+ gerador de carga sob demanda).
# A mesma aplicação roda no Kubernetes (pasta k8s/, scripts/k8s-up.sh).
# Subir tudo:   docker compose up -d --build
# Derrubar:     docker compose down          (mantém os dados)
# Zerar dados:  docker compose down -v       (apaga o volume)

name: aps-sd

x-api-common: &api-common
  restart: unless-stopped
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/live"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a restart/down do contêiner
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # $$ escapa o $ para a variável ser lida DENTRO do contêiner
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  air-quality-api:
    <<: *api-common
    build:
      context: ./src/AirQuality.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/air-quality-api:${APP_VERSION:-1.1.0}
    environment:
      # "postgres" é o NOME DO SERVIÇO acima: o DNS interno do Compose resolve para o IP do contêiner
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=air_quality;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=8
      Alerts__Pm25Limit: ${AIR_PM25_LIMIT:-25}
      Alerts__Pm25ConsecutiveReadings: ${AIR_PM25_CONSECUTIVE_READINGS:-3}
    ports:
      - "${AIR_QUALITY_API_PORT:-5001}:8080"

  flooding-api:
    <<: *api-common
    build:
      context: ./src/Flooding.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/flooding-api:${APP_VERSION:-1.1.0}
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=flooding;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=8
      Alerts__OverflowLevelCm: ${FLOODING_OVERFLOW_LEVEL_CM:-300}
    ports:
      - "${FLOODING_API_PORT:-5002}:8080"

  thermal-inversion-api:
    <<: *api-common
    build:
      context: ./src/ThermalInversion.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/thermal-inversion-api:${APP_VERSION:-1.1.0}
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=thermal_inversion;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=8
      Alerts__MinInversionGradientC: ${THERMAL_MIN_INVERSION_GRADIENT_C:-0}
    ports:
      - "${THERMAL_INVERSION_API_PORT:-5003}:8080"

  # Gerador de carga que simula os sensores. NÃO sobe com "docker compose up" (está no profile "load").
  # Rodar:  docker compose run --rm load-generator --rate 100 --duration 60
  load-generator:
    build: ./tools/load-generator
    image: aps-sd/load-generator:${APP_VERSION:-1.1.0}
    profiles: ["load"]
    environment:
      # Dentro da rede do Compose, as APIs são achadas pelo nome do serviço, na porta interna 8080
      AIR_QUALITY_API_URL: http://air-quality-api:8080
      FLOODING_API_URL: http://flooding-api:8080
      THERMAL_INVERSION_API_URL: http://thermal-inversion-api:8080
    command: ["--rate", "50", "--duration", "60"]
    networks:
      - backend
    depends_on:
      air-quality-api:
        condition: service_healthy
      flooding-api:
        condition: service_healthy
      thermal-inversion-api:
        condition: service_healthy

networks:
  backend:

volumes:
  postgres-data:
