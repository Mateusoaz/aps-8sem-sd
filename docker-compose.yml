# Pilha completa para desenvolver sem cluster: PostgreSQL + Redis + RabbitMQ + 3 APIs .NET 8 + cliente web.
# A mesma aplicação roda no Kubernetes (pasta k8s/, scripts/k8s-up.sh); aqui o nginx do cliente faz o papel do gateway.
# Subir tudo:   docker compose up -d --build
# Derrubar:     docker compose down          (mantém os dados)
# Zerar dados:  docker compose down -v       (apaga os volumes)

name: aps-sd

# Variáveis comuns às três APIs (âncora YAML, reaproveitada abaixo com <<: *api-env)
x-api-env: &api-env
  ConnectionStrings__Redis: redis:6379
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}@rabbitmq:5672
  Cache__Enabled: ${CACHE_ENABLED:-true}
  Cache__TtlSeconds: ${CACHE_TTL_SECONDS:-10}
  Queue__Enabled: ${QUEUE_ENABLED:-true}

x-api-common: &api-common
  restart: unless-stopped
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/live"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a restart/down do contêiner
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # $$ escapa o $ para a variável ser lida DENTRO do contêiner
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache das consultas agregadas. Sem volume: cache é descartável.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fila de avaliação de alertas. Volume: fila durável e mensagens persistentes sobrevivem ao restart.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: rabbitmq          # o RabbitMQ guarda os dados numa pasta com o nome do host: precisa ser fixo
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # painel: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  air-quality-api:
    <<: *api-common
    build:
      context: ./src/AirQuality.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/air-quality-api:${APP_VERSION:-1.1.0}
    environment:
      <<: *api-env
      # "postgres" é o NOME DO SERVIÇO acima — o DNS interno do Compose resolve para o IP do contêiner
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=air_quality;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Alerts__Pm25Limit: ${AIR_PM25_LIMIT:-25}
      Alerts__Pm25ConsecutiveReadings: ${AIR_PM25_CONSECUTIVE_READINGS:-3}
    ports:
      - "${AIR_QUALITY_API_PORT:-5001}:8080"

  flooding-api:
    <<: *api-common
    build:
      context: ./src/Flooding.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/flooding-api:${APP_VERSION:-1.1.0}
    environment:
      <<: *api-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=flooding;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Alerts__OverflowLevelCm: ${FLOODING_OVERFLOW_LEVEL_CM:-300}
    ports:
      - "${FLOODING_API_PORT:-5002}:8080"

  thermal-inversion-api:
    <<: *api-common
    build:
      context: ./src/ThermalInversion.Api
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: aps-sd/thermal-inversion-api:${APP_VERSION:-1.1.0}
    environment:
      <<: *api-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=thermal_inversion;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Alerts__MinInversionGradientC: ${THERMAL_MIN_INVERSION_GRADIENT_C:-0}
    ports:
      - "${THERMAL_INVERSION_API_PORT:-5003}:8080"

  # Cliente web. No Compose não há Ingress: o nginx do cliente encaminha /api/v1/<serviço> para cada API.
  web-client:
    build: ./src/WebClient
    image: aps-sd/web-client:${APP_VERSION:-1.1.0}
    restart: unless-stopped
    volumes:
      - ./src/WebClient/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_CLIENT_PORT:-8080}:8080"
    networks:
      - backend
    depends_on:
      - air-quality-api
      - flooding-api
      - thermal-inversion-api

  # Gerador de carga — NÃO sobe com "docker compose up" (está no profile "load").
  # Rodar:  docker compose run --rm load-generator --rate 100 --duration 60
  load-generator:
    build: ./tools/load-generator
    image: aps-sd/load-generator:${APP_VERSION:-1.1.0}
    profiles: ["load"]
    environment:
      # Dentro da rede do Compose, as APIs são achadas pelo nome do serviço, na porta interna 8080
      AIR_QUALITY_API_URL: http://air-quality-api:8080
      FLOODING_API_URL: http://flooding-api:8080
      THERMAL_INVERSION_API_URL: http://thermal-inversion-api:8080
    command: ["--rate", "50", "--duration", "60"]
    networks:
      - backend
    depends_on:
      air-quality-api:
        condition: service_healthy
      flooding-api:
        condition: service_healthy
      thermal-inversion-api:
        condition: service_healthy

networks:
  backend:

volumes:
  postgres-data:
  rabbitmq-data:
