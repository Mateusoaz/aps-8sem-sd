name: aps-sistemas-distribuidos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: aps_monitoramento
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U postgres -d aps_monitoramento -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  air-quality-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api1/api/Dockerfile
    image: aps-air-quality:3.0.0
    environment:
      PORT: "3001"
      DATABASE_URL: Host=postgres;Database=aps_monitoramento;Username=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "${API1_HOST_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  overflow-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api2/api/Dockerfile
    image: aps-overflow:3.0.0
    environment:
      PORT: "3002"
      DATABASE_URL: Host=postgres;Database=aps_monitoramento;Username=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "${API2_HOST_PORT:-3002}:3002"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3002/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  thermal-inversion-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api4/api/Dockerfile
    image: aps-thermal-inversion:3.0.0
    environment:
      PORT: "3003"
      DATABASE_URL: Host=postgres;Database=aps_monitoramento;Username=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "${API3_HOST_PORT:-3003}:3003"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3003/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
    name: aps-sistemas-distribuidos_postgres-data
