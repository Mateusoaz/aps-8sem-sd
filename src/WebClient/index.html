<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Ambiental</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2430; --muted: #5d6878; --line: #dde2e8;
    --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --card: #1b212a; --text: #e6e9ee; --muted: #9aa4b2; --line: #2c3440;
            --ok: #48bb78; --warn: #ecc94b; --bad: #fc8181; --accent: #63b3ed; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 32px; display: grid; gap: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 17px; }
  .status { font-size: 13px; color: var(--muted); min-height: 3.6em; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .Healthy { background: var(--ok); } .Degraded { background: var(--warn); } .Unhealthy, .erro { background: var(--bad); }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
  button:hover { background: var(--accent); color: var(--card); }
  pre { margin: 0; font-size: 12px; background: var(--bg); border-radius: 6px; padding: 8px; overflow: auto; max-height: 180px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .bar { height: 10px; background: var(--accent); border-radius: 3px; }
  label { color: var(--muted); font-size: 13px; }
  select, input { font: inherit; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Monitor Ambiental Urbano</h1>
  <p>Cliente leve da APS. Tudo passa pelo gateway; cada resposta mostra o pod que atendeu (X-Pod).</p>
</header>
<main>
  <div class="grid" id="services"></div>

  <section>
    <h2>Balanceamento entre réplicas</h2>
    <div class="buttons">
      <label>Serviço <select id="lb-service"></select></label>
      <label>Requisições <input id="lb-count" type="number" value="20" min="1" max="500" style="width:80px"></label>
      <button id="lb-run">Disparar</button>
    </div>
    <div class="scroll"><table id="lb-table"><thead><tr><th>Pod (X-Pod)</th><th>Versão</th><th>Respostas</th><th style="width:45%"></th></tr></thead><tbody></tbody></table></div>
  </section>

  <section>
    <h2>Últimas requisições</h2>
    <div class="scroll"><table id="log"><thead><tr>
      <th>Hora</th><th>Método</th><th>Caminho</th><th>HTTP</th><th>ms</th><th>X-Pod</th><th>X-Versao</th><th>X-Cache</th><th>X-Alerta</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</main>

<script>
const rnd = (min, max) => Math.round((min + Math.random() * (max - min)) * 10) / 10;
const pick = list => list[Math.floor(Math.random() * list.length)];

const SERVICES = [
  {
    id: "air-quality", name: "Qualidade do ar",
    newReading: () => ({ path: "/particulate", body: {
      stationId: pick(["EST-01", "EST-02", "EST-03"]), sensorId: "SEN-PM-01", areaId: "CENTRO",
      pm25: rnd(5, 60), pm10: rnd(10, 90) } }),
    query: "/areas/CENTRO/average?hours=24",
  },
  {
    id: "flooding", name: "Alagamento",
    newReading: () => ({ path: "/water-level", body: {
      monitoringPointId: pick(["PT-01", "PT-02"]), sensorId: "SEN-N-01", waterLevelCm: rnd(150, 380) } }),
    query: "/monitoring-points/PT-01/latest",
  },
  {
    id: "thermal-inversion", name: "Inversão térmica",
    newReading: () => {
      const surface = rnd(8, 25);
      return { path: "/temperature-profile", body: {
        stationId: pick(["EST-T1", "EST-T2"]), areaId: "CENTRO", surfaceSensorId: "S-SUP", upperSensorId: "S-ALT",
        surfaceTemperatureC: surface, upperTemperatureC: rnd(surface - 6, surface + 5) } };
    },
    query: "/areas/CENTRO/thermal-profile?hours=24",
  },
];

const base = id => `/api/v1/${id}`;

async function call(method, path, body) {
  const start = performance.now();
  let response, text;
  try {
    response = await fetch(path, {
      method, headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
    text = await response.text();
  } catch (error) {
    addLog(method, path, "falha", performance.now() - start, null);
    return { ok: false, status: 0, text: String(error), headers: new Headers() };
  }
  addLog(method, path, response.status, performance.now() - start, response.headers);
  return { ok: response.ok, status: response.status, text, headers: response.headers };
}

function addLog(method, path, status, ms, headers) {
  const h = name => (headers && headers.get(name)) || "";
  const row = document.createElement("tr");
  [new Date().toLocaleTimeString(), method, path, status, ms.toFixed(0),
   h("X-Pod"), h("X-Versao"), h("X-Cache"), h("X-Alerta")].forEach(value => {
    const cell = document.createElement("td");
    cell.textContent = value;
    row.appendChild(cell);
  });
  const body = document.querySelector("#log tbody");
  body.prepend(row);
  while (body.rows.length > 30) body.deleteRow(-1);
}

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; }
}

function renderCards() {
  const grid = document.getElementById("services");
  const select = document.getElementById("lb-service");
  for (const service of SERVICES) {
    const card = document.createElement("section");
    card.innerHTML = `
      <h2>${service.name}</h2>
      <div class="status" id="status-${service.id}">verificando...</div>
      <div class="buttons">
        <button data-action="send">Enviar leitura</button>
        <button data-action="query">Consultar</button>
        <button data-action="alerts">Alertas</button>
      </div>
      <pre id="out-${service.id}">—</pre>`;
    const out = card.querySelector("pre");
    card.querySelector('[data-action="send"]').onclick = async () => {
      const reading = service.newReading();
      const result = await call("POST", base(service.id) + reading.path, reading.body);
      out.textContent = `HTTP ${result.status}\n` + pretty(result.text);
    };
    card.querySelector('[data-action="query"]').onclick = async () => {
      const result = await call("GET", base(service.id) + service.query);
      out.textContent = `HTTP ${result.status} · cache ${result.headers.get("X-Cache") || "-"}\n` + pretty(result.text);
    };
    card.querySelector('[data-action="alerts"]').onclick = async () => {
      const result = await call("GET", base(service.id) + "/alerts?limit=5");
      out.textContent = `HTTP ${result.status}\n` + pretty(result.text);
    };
    grid.appendChild(card);
    select.add(new Option(service.name, service.id));
  }
}

// A readiness é consultada sem entrar no log: ela roda a cada 5 s e encobriria o resto.
async function refreshStatus() {
  for (const service of SERVICES) {
    const box = document.getElementById(`status-${service.id}`);
    try {
      const response = await fetch(base(service.id) + "/health/ready", { cache: "no-store" });
      const data = await response.json();
      const deps = Object.entries(data.dependencias || {})
        .map(([name, dep]) => `<span class="dot ${dep.status}"></span>${name}: ${dep.detalhe || dep.status}`).join("<br>");
      box.innerHTML = `<span class="dot ${data.status}"></span><b>${data.status}</b> · ${data.instancia} · v${data.versao}<br>${deps}`;
    } catch {
      box.innerHTML = `<span class="dot erro"></span><b>sem resposta</b> (nenhum pod pronto?)`;
    }
  }
}

document.getElementById("lb-run").onclick = async () => {
  const id = document.getElementById("lb-service").value;
  const count = Math.min(500, Math.max(1, Number(document.getElementById("lb-count").value) || 20));
  const tally = new Map();
  for (let i = 0; i < count; i++) {
    const result = await call("GET", base(id) + "/health/live");
    const key = `${result.headers.get("X-Pod") || `HTTP ${result.status}`}|${result.headers.get("X-Versao") || "-"}`;
    tally.set(key, (tally.get(key) || 0) + 1);
  }
  const body = document.querySelector("#lb-table tbody");
  body.innerHTML = "";
  const max = Math.max(...tally.values());
  [...tally.entries()].sort((a, b) => b[1] - a[1]).forEach(([key, n]) => {
    const [pod, version] = key.split("|");
    const row = body.insertRow();
    row.insertCell().textContent = pod;
    row.insertCell().textContent = version;
    row.insertCell().textContent = n;
    row.insertCell().innerHTML = `<div class="bar" style="width:${(100 * n / max).toFixed(0)}%"></div>`;
  });
};

renderCards();
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
