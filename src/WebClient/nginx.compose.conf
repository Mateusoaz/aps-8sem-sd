# Docker Compose: não há Ingress, então o próprio nginx faz o papel de gateway,
# encaminhando cada prefixo para a API certa pelo nome do serviço na rede do Compose.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/air-quality/       { proxy_pass http://air-quality-api:8080; }
    location /api/v1/flooding/          { proxy_pass http://flooding-api:8080; }
    location /api/v1/thermal-inversion/ { proxy_pass http://thermal-inversion-api:8080; }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
