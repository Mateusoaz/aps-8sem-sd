# Kubernetes: o nginx só entrega a página. Quem leva /api/v1/<serviço> até cada API é o Ingress.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Usado pelas probes: responde sem depender de nada
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
