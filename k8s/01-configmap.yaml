# Configuração comum das três APIs, sem nada sensível (usuário e senha ficam no Secret
# "banco-credenciais", criado a partir do .env). Todas as chaves viram variáveis de ambiente (envFrom).
# "__" é o separador de seção do .NET: Alerts__Pm25Limit chega na aplicação como Alerts:Pm25Limit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aps-config
  namespace: aps
data:
  # Nome do Service do banco: o DNS do cluster resolve para o pod postgres-0
  BANCO_HOST: "postgres"

  # Máximo de conexões que cada réplica abre com o Postgres. Sem limite, o Npgsql deixa 100 por réplica
  # e poucas réplicas ocupam todas as vagas do banco. Pior caso: 14 réplicas (10 + 2 + 2) x (8 + 1 da
  # readiness) = 126, abaixo do max_connections=200 do banco (10-postgres.yaml).
  BANCO_POOL_MAXIMO: "8"

  # Regras de alerta
  Alerts__Pm25Limit: "25"
  Alerts__Pm25ConsecutiveReadings: "3"
  Alerts__OverflowLevelCm: "300"
  Alerts__MinInversionGradientC: "0"
