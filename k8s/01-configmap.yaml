# Configuração comum às três APIs (nada sensível aqui — usuários e senhas ficam no Secret).
# As chaves viram variáveis de ambiente via envFrom; "__" é o separador de seção do .NET.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aps-config
  namespace: aps
data:
  BANCO_HOST: "postgres"                    # nome do Service do banco (o mesmo do Compose)
  Alerts__Pm25Limit: "25"                   # qualidade do ar
  Alerts__Pm25ConsecutiveReadings: "3"
  Alerts__OverflowLevelCm: "300"            # alagamento
  Alerts__MinInversionGradientC: "0"        # inversão térmica
