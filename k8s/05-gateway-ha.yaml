# Gateway redundante. O Traefik (o controlador do Ingress) vem do k3s com UMA réplica: se o nó dela cai
# ou é drenado, NINGUÉM entra no cluster, mesmo com as APIs saudáveis. Foi o que o experimento
# "no-drenado" mostrou: o drain despejou o Traefik, o novo levou ~12 s só para baixar a imagem no outro
# nó, e o gateway ficou fora do ar o resto do teste.
#
# Aqui: 2 réplicas, espalhadas por nós diferentes, e um PodDisruptionBudget que impede um drain de
# tirar as duas ao mesmo tempo. HelmChartConfig é o jeito do k3s de ajustar o Traefik que ele instala
# (é aplicado pelo controlador de Helm do próprio k3s; vale só em k3s/k3d).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
