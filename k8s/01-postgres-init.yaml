apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: aps
data:
  01-create-databases.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE DATABASE air_quality;
    CREATE DATABASE flooding;
    CREATE DATABASE thermal_inversion;
    SQL
