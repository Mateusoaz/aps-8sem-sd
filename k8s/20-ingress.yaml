# Ingress é a entrada HTTP: preserva o prefixo e encaminha cada domínio ao Service correspondente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aps-api
  namespace: aps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/air-quality
            pathType: Prefix
            backend:
              service:
                name: air-quality-api
                port:
                  number: 8080
          - path: /api/v1/flooding
            pathType: Prefix
            backend:
              service:
                name: flooding-api
                port:
                  number: 8080
          - path: /api/v1/thermal-inversion
            pathType: Prefix
            backend:
              service:
                name: thermal-inversion-api
                port:
                  number: 8080
