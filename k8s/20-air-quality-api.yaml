# API air-quality: serviço SEM estado -> Deployment (2 réplicas) + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-quality-api
  namespace: aps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: air-quality-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1            # até 1 pod a mais durante a troca
      maxUnavailable: 0      # nenhum a menos
  template:
    metadata:
      labels:
        app: air-quality-api
        camada: api                # todas as APIs: usado para espalhá-las juntas
    spec:
      # Espalha as réplicas pelos 3 nós (server-0, agent-0 e agent-1).
      topologySpreadConstraints:
        # As réplicas DESTE serviço: no máximo 1 de diferença entre os nós.
        # Honor ignora nó cordonado (drain), senão o pod ficaria Pending durante a manutenção.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app: air-quality-api }
          matchLabelKeys: [pod-template-hash]   # no rolling update, a versão nova também se espalha
        # Todas as APIs juntas: preferência (não bloqueia), para nenhum nó concentrar os pods.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { camada: api }
      containers:
        - name: api
          image: aps-sd/air-quality-api:1.1.0       # tag fixa; importada com k3d image import
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:                       # espera o gateway parar de enviar tráfego antes do encerramento
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aps-config           # host do banco e regras de alerta
          env:
            - name: PATH_BASE              # prefixo que o gateway usa para este serviço
              value: "/air-quality"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: POSTGRES_PASSWORD }
            - name: ConnectionStrings__Default
              value: "Host=$(BANCO_HOST);Port=5432;Database=air_quality;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Maximum Pool Size=8"
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # sem requests de CPU o HPA não funciona
            limits:   { cpu: 500m, memory: 320Mi }
          # A API só abre a porta depois de criar o banco/tabelas: a startup dá até 5 min
          # para isso (o cluster pode estar baixando a imagem do banco), sem a liveness reiniciar o contêiner.
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 3
            failureThreshold: 100
          # Liveness: só o processo. 3 falhas seguidas -> reinicia o contêiner.
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: consulta o banco A CADA chamada. 2 falhas -> sai do Service, sem reiniciar.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: air-quality-api
  namespace: aps
spec:
  selector:
    app: air-quality-api
  ports:
    - port: 80
      targetPort: 8080
