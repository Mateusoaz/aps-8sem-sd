# API Qualidade do ar: serviço SEM estado -> Deployment (2 réplicas) + Service.
# Escala automática pelo HPA (40-hpa.yaml), de 2 a 10 réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-quality-api
  namespace: aps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: air-quality-api            # tem que bater com template.metadata.labels
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                 # na troca de versão, cria 1 pod novo a mais...
      maxUnavailable: 0           # ...e só remove um antigo quando o novo estiver pronto
  template:
    metadata:
      labels:
        app: air-quality-api
        tier: api
    spec:
      # Divide as réplicas por igual entre os nós de trabalho (diferença máxima de 1 pod entre eles).
      # O nó servidor tem a marca (taint) de plano de controle e não recebe pods da aplicação, então a
      # divisão é entre os dois agentes. nodeTaintsPolicy: Honor tira da conta o nó que não aceita o pod
      # (o servidor e um agente drenado), senão um drain deixaria as réplicas novas presas em Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: air-quality-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: aps-sd/air-quality-api:1.1.0      # tag fixa; levada ao cluster com "k3d image import"
          imagePullPolicy: IfNotPresent           # usa a imagem importada, sem procurar na internet
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aps-config                  # host do banco, pool e regras de alerta
          env:
            - name: PATH_BASE                     # prefixo do Ingress, que a API tira antes de rotear
              value: /air-quality
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: POSTGRES_PASSWORD }
            # $(VAR) monta o valor a partir das variáveis acima (ConfigMap + Secret)
            - name: ConnectionStrings__Default
              value: "Host=$(BANCO_HOST);Port=5432;Database=air_quality;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Maximum Pool Size=$(BANCO_POOL_MAXIMO)"
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # reserva; o HPA calcula a % de CPU sobre este valor
            limits:   { cpu: 500m, memory: 384Mi }   # teto: CPU acima disso é estrangulada; memória acima, OOMKilled
          # Startup: segura a liveness enquanto o .NET sobe (até 60 s)
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: só o processo, sem o banco. 3 falhas seguidas -> reinicia o contêiner.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: consulta o banco a cada chamada. 2 falhas seguidas -> o pod sai do Service (sem reiniciar).
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Encerramento gracioso: o pod espera 5 s antes de receber o SIGTERM. Nesse tempo o Service e o
          # gateway tiram o pod da lista de destinos e nenhuma requisição nova chega a um processo fechando.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: air-quality-api
  namespace: aps
spec:
  selector:
    app: air-quality-api              # manda tráfego para todo pod com este rótulo que esteja PRONTO
  ports:
    - name: http
      port: 80
      targetPort: http
