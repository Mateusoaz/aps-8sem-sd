# Cliente leve: página estática servida por nginx (sem root). Sem estado -> Deployment + Service.
# Acessado pelo gateway em http://localhost:8081/ ; a página chama as APIs pelo mesmo endereço.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: aps
  labels:
    app: web-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-client
        tier: cliente
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web-client
      containers:
        - name: nginx
          image: aps-sd/web-client:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 20m,  memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          # Liveness: o nginx está de pé (porta aberta)? Readiness: a rota /healthz responde?
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
  namespace: aps
spec:
  selector:
    app: web-client
  ports:
    - name: http
      port: 80
      targetPort: http
