# Serviço headless dá ao StatefulSet identidade DNS estável para seu pod postgres-0.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: aps
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Serviço ClusterIP é o endereço usado pelas APIs: Host=postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aps
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# StatefulSet mantém a identidade do banco; volumeClaimTemplates cria PVC persistente.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aps
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aps-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aps-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: init
          # Este script cria os três bancos lógicos na primeira inicialização do volume.
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    # O PVC pertence ao banco, não ao ciclo de vida do pod; recriar o pod preserva os dados.
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
