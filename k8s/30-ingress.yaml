# Ponto único de entrada (gateway), executado pelo Traefik que já vem no k3d. Roteia POR CAMINHO:
#   /air-quality/...        -> Service air-quality-api
#   /flooding/...           -> Service flooding-api
#   /thermal-inversion/...  -> Service thermal-inversion-api
# A URL chega inteira na API, que tira o prefixo sozinha (PATH_BASE no Deployment). Assim o manifesto
# não depende de nenhum recurso específico do Traefik para reescrever a URL.
#
# Camada 7: o Traefik lê a URL de cada requisição e reparte as requisições entre os pods prontos.
# O cabeçalho X-Pod de cada resposta mostra qual pod atendeu.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: aps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /air-quality
            pathType: Prefix
            backend:
              service:
                name: air-quality-api
                port:
                  name: http
          - path: /flooding
            pathType: Prefix
            backend:
              service:
                name: flooding-api
                port:
                  name: http
          - path: /thermal-inversion
            pathType: Prefix
            backend:
              service:
                name: thermal-inversion-api
                port:
                  name: http
