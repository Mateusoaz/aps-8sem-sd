# Gateway único (API Gateway da APS), executado pelo Traefik que já vem no k3d.
# Roteia POR CAMINHO: cada API tem o seu prefixo, e o que sobrar ("/") vai para o cliente web.
# O prefixo da regra é o mesmo das rotas das APIs (/api/v1/<serviço>/...), então a URL chega
# inteira e sem reescrita, sem depender de middleware específico do Traefik.
#
# Camada 7: o Traefik lê a URL de cada requisição e distribui requisição a requisição entre os pods
# prontos (rodízio). O cabeçalho X-Pod de cada resposta é a prova.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: aps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/air-quality
            pathType: Prefix
            backend:
              service:
                name: air-quality-api
                port:
                  name: http
          - path: /api/v1/flooding
            pathType: Prefix
            backend:
              service:
                name: flooding-api
                port:
                  name: http
          - path: /api/v1/thermal-inversion
            pathType: Prefix
            backend:
              service:
                name: thermal-inversion-api
                port:
                  name: http
          - path: /                       # o caminho mais específico ganha; "/" pega o que sobrar
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  name: http
