# Escala automática da API de qualidade do ar (a de ingestão medida nos experimentos).
# O HPA lê a CPU dos pods no metrics-server (já vem no k3s) e muda o número de réplicas do Deployment.
# Sobe assim que a média passa da meta e só reduz depois de 5 minutos abaixo dela (padrão do HPA).
#
# ATENÇÃO nos experimentos: o HPA desfaz "kubectl scale". Para a linha de base (1 réplica) e a
# escala manual (1, 2, 4, 8), remova antes:  kubectl delete hpa air-quality-api -n aps
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: air-quality-api
  namespace: aps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: air-quality-api
  minReplicas: 2                 # nunca menos que 2: uma pode cair sem derrubar o serviço
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # meta: 50% do requests de CPU (100m), em média entre as réplicas
