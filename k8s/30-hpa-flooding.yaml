# HPA ajusta réplicas pela CPU média; as métricas vêm do metrics-server do cluster k3s.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flooding-api
  namespace: aps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flooding-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
