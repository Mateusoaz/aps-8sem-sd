# Cache (Redis): guarda por alguns segundos o resultado das consultas agregadas das três APIs.
# Deployment SEM volume, de propósito: cache é descartável. Se o pod morrer, o novo só começa vazio,
# e enquanto isso as APIs consultam direto no banco (X-Cache: BYPASS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: dados
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # Sem gravar em disco e com teto de memória: ao encher, descarta as chaves menos usadas
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 50m,  memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aps
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
