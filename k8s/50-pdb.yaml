# PodDisruptionBudget: limita quantos pods de um serviço uma interrupção VOLUNTÁRIA (kubectl drain,
# atualização de nó) pode tirar ao mesmo tempo. Com minAvailable: 1, o drain nunca remove a última
# réplica pronta: se as duas estiverem no nó drenado, ele despeja uma, espera a substituta ficar pronta
# em outro nó e só então despeja a outra.
# Não vale para falhas (nó que cai, kubectl delete pod) nem para o rolling update (esse é controlado
# por maxSurge/maxUnavailable no Deployment).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: air-quality-api
  namespace: aps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: air-quality-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flooding-api
  namespace: aps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: flooding-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thermal-inversion-api
  namespace: aps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: thermal-inversion-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-client
  namespace: aps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-client
